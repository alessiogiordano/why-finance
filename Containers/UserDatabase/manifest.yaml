kind: Namespace
apiVersion: v1
metadata:
    name: why-finance
    labels:
        name: why-finance
---
kind: Service
apiVersion: v1
metadata:
    name: users-database
    labels:
        app: users-database
    namespace: why-finance
spec:
    ports:
    - name: mysql
      port: 3306
    selector:
        app: users-database
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: users-database
    labels:
        app: users-database
    namespace: why-finance
spec:
    replicas: 1
    selector:
        matchLabels:
            app: users-database
    template:
        metadata:
            labels:
                app: users-database
        spec:
            volumes:
            - name: users-mysql-data
              emptyDir: {}
            containers:
            - name: users-database
              image: mysql:8.0
              imagePullPolicy: IfNotPresent # Always # Never
              ports:
              - containerPort: 3306
              volumeMounts:
              - name: users-mysql-data
                mountPath: /var/lib/mysql
              env:
              - name: MYSQL_ROOT_PASSWORD
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: USERS_DB_PASSWORD
              - name: MYSQL_DATABASE
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: USERS_DB_NAME
              startupProbe:
                  exec:
                      command:
                      - /bin/sh
                      - -c
                      - mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD
                  failureThreshold: 20
                  periodSeconds: 10