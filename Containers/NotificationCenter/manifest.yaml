kind: Namespace
apiVersion: v1
metadata:
    name: why-finance
    labels:
        name: why-finance
#---
#kind: Service
#apiVersion: v1
#metadata:
#    name: notification-center
#    labels:
#        app: notification-center
#    namespace: why-finance
#spec:
#    selector:
#        app: notification-center
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: notification-center
    labels:
        app: notification-center
    namespace: why-finance
spec:
    replicas: 1
    selector:
        matchLabels:
            app: notification-center
    template:
        metadata:
            labels:
                app: notification-center
        spec:
            containers:
            - name: notification-center
              image: notification-center:latest
              imagePullPolicy: IfNotPresent # Always # Never
              env:
              - name: CIRCUIT_BREAKER_PORT
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: CIRCUIT_BREAKER_PORT
              - name: KAFKA_BROKERS
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: KAFKA_BROKERS
              - name: KAFKA_GROUP_ID
                value: "notification-center"
              - name: KAFKA_TOPICS
                value: "notification-center"
              - name: KAFKA_POLLING_INTERVAL
                value: "1.0"
              - name: APNS_ENDPOINT
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: APNS_ENDPOINT