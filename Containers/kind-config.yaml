kind: Service
apiVersion: v1
metadata:
    name: circuit_breaker
    labels:
        app: circuit_breaker
    namespace: why-finance
spec:
    ports:
    - port: 30112
    selector:
        app: circuit_breaker
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: circuit_breaker
    labels:
        app: circuit_breaker
    namespace: why-finance
spec:
    replicas: 1
    selector:
        matchLabels:
            app: circuit_breaker
    template:
        metadata:
            labels:
                app: circuit_breaker
        spec:
            initContainers:
            - name: circuit_breaker_init
              image: redis:alpine
              command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for Redis"; sleep 1; done;']
            containers:
            - name: circuit_breaker
              image: circuit_breaker:latest
              imagePullPolicy: IfNotPresent # Always # Never
              ports:
              - containerPort: 30112
              env:
              - name: REDIS_PORT
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: REDIS_PORT
              - name: CIRCUIT_BREAKER_PORT
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: CIRCUIT_BREAKER_PORT
