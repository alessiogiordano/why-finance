kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: why-finance
nodes:
- role: control-plane
- role: worker
  labels:
      custom-label: "worker"
  extraPortMappings:
  - containerPort: 30092
    hostPort: 9092
---
kind: Namespace
apiVersion: v1
metadata:
    name: why-finance
    labels:
        name: why-finance
########################################
---
########################################
#--------------- Users -----------------
##########################################################################################
kind: Service
apiVersion: v1
metadata:
    name: users_database
    labels:
        app: users_database
    namespace: why-finance
spec:
    ports:
    - port:3306
    selector:
        app: users_database
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: users_database
    labels:
        app: users_database
    namespace: why-finance
spec:
    replicas: 1
    selector:
        matchLabels:
            app: users_database
    template:
        metadata:
            labels:
                app: users_database
        spec:
            volumes:
            - name: users_mysql_data
              emptyDir: {}
            containers:
            - name: users_database
              image: mysql:8.0
              imagePullPolicy: IfNotPresent # Always # Never
              ports:
              - containerPort: 3306
              volumeMounts:
              - name: users_mysql_data
                mountPath: /var/lib/mysql
              env:
              - name: MYSQL_ROOT_PASSWORD
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: USERS_DB_PASSWORD
              - name: MYSQL_DATABASE
                valueFrom:
                    configMapKeyRef:
                        name: why-finance-env
                        key: USERS_DB_NAME
              startupProbe:
                  exec:
                      command:
                      - /bin/sh
                      - -c
                      - mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD
                  failureThreshold: 20
                  periodSeconds: 10
########################################
---
