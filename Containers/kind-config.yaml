#--------------- Monitor ---------------
##########################################################################################
kind: Service
apiVersion: v1
metadata:
    name: monitor
    labels:
        app: monitor
    namespace: why-finance
spec:
    ports:
    - port: 9090
    selector:
        app: monitor
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: monitor
    labels:
        app: monitor
    namespace: why-finance
spec:
    replicas: 1
    selector:
        matchLabels:
            app: monitor
    template:
        metadata:
            labels:
                app: monitor
        spec:
            volumes:
            - name: monitor_prometheus_data
              emptyDir: {}
            - name: monitor_prometheus_configuration
              hostPath:
                  path: ./Monitor/prometheus.yml
                  type: File
            containers:
            - name: monitor
              image: prom/prometheus
              imagePullPolicy: IfNotPresent # Always # Never
              ports:
              - containerPort: 9090
              volumeMounts:
              - name: monitor_prometheus_data
                mountPath: /prometheus
              - name: monitor_prometheus_configuration
                mountPath: /etc/prometheus/prometheus.yml
---
